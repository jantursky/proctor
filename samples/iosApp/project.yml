name: ProctorApp
options:
  bundleIdPrefix: com.jantursky.proctor.sample
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # The Kotlin framework is built for arm64 simulators and devices only.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_BUNDLE_IDENTIFIER: com.jantursky.proctor.sample.app
    FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS: "$(inherited) -framework Shared"
targets:
  ProctorApp:
    type: application
    platform: iOS
    sources:
      - ProctorApp
      # The bridge ships with the library; the app compiles it in as any consumer would.
      - path: ../../proctor-ios/ios-bridge/ProctorFoundationModelsBridge.swift
    info:
      path: ProctorApp/Info.plist
      properties:
        CFBundleDisplayName: Proctor sample
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Lets you pull the result files from the Files app or Finder.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :samples:shared:embedAndSignAppleFrameworkForXcode
