name: Feature request
description: A grader, backend, report view or platform you would like Proctor to support.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Proctor to do?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
